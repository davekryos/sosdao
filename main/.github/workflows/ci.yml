name: "CI"

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, reopened]

jobs:
  ci:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"

      - name: "Setup"
        uses: "actions/setup-node@v3"

      - name: "Install"
        run: "npm ci"

      - name: "Lint"
        run: "npm run lint"

      - name: "Test"
        run: "npm test"
